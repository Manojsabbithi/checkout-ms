apiVersion: apps/v1
kind: Service
metadata:
  name: i27-helpdesk-ui
  namespace: i27-helpdesk-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: i27-helpdesk-ui
  template:
    metadata:
      labels:
        app: i27-helpdesk-ui
    spec:
      containers:
        - name: i27-helpdesk-ui
          image: manojdock97/i27-helpdesk-ui:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "128Mi"
              cpu: "100m"